<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizy — Live Quiz Arena</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="portal-page">
  <main class="portal-shell">
    <section class="brand-panel">
      <div class="eyebrow">REAL-TIME QUIZ ARENA</div>
      <h1>Make every<br><em>answer</em> count.</h1>
      <p>Fast rounds. Live rankings. A little pressure makes the smartest answer even sweeter.</p>
      <div class="orbit-card"><span class="orbit-dot"></span><span>15 sec rounds</span><strong>LIVE</strong></div>
    </section>
    <section class="portal-card glass-card">
      <div class="logo-mark">Q<span>•</span></div>
      <p class="kicker">WELCOME TO QUIZY</p>
      <h2>Ready to play?</h2>
      <p class="muted">Choose your seat in the arena.</p>
      <div class="portal-actions">
        <a class="primary-btn" href="/host.html">Create a Quiz <span>↗</span></a>
        <a class="secondary-btn" href="/player.html">Join with a PIN <span>→</span></a>
      </div>
      <div class="tiny-note"><span>✦</span> Server-authoritative scoring · Socket.io</div>
    </section>
  </main>
</body>
</html>
